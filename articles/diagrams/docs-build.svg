<svg class="tm-svg" viewBox="0 0 880 450" width="880" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tr-docs-build-title tr-docs-build-description">
  <title id="tr-docs-build-title">How this site is built</title>
  <desc id="tr-docs-build-description">The roxygen2 comments in R/*.R become man/*.Rd help pages when devtools::document() runs, and those pages are committed. On every push to main a GitHub Action runs pkgdown, which reads man/, the articles in vignettes/articles/, README.md and _pkgdown.yml, writes the finished HTML site to docs/, and a deploy step commits docs/ to the gh-pages branch that GitHub Pages serves.</desc>
  <style>
    .tm-svg .background { fill: #ffffff; }
    .tm-svg .group { fill: #f5f5f5; }
    .tm-svg .box { fill: #fff7f2; stroke: #5f6368; stroke-width: 1.5; }
    .tm-svg .store { fill: #eef3fb; stroke: #5f6368; stroke-width: 1.5; }
    .tm-svg .accent-box { fill: #fff7f2; stroke: #ff5722; stroke-width: 2.5; }
    .tm-svg .wire { fill: none; stroke: #5f6368; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .tm-svg text { fill: #202124; font-family: 'Roboto', sans-serif; font-size: 13px; }
    .tm-svg text.title { font-size: 15px; font-weight: 700; }
    .tm-svg text.small { fill: #6b7280; font-size: 11px; }
    .tm-svg text.mono { font-family: 'Roboto Mono', monospace; font-size: 11px; }
    .tm-svg .dot { fill: #ff5722; }
    .tm-svg .dot.alt { fill: #1565c0; }
    .tm-svg .dot.ok { fill: #1b8a3a; }
    @media (prefers-reduced-motion: no-preference) { .tm-svg .wire { animation: tm-march 1.2s linear infinite; } }
    @media (prefers-reduced-motion: reduce) { .tm-svg .dot { display: none; } }
    @keyframes tm-march { to { stroke-dashoffset: -18; } }
  </style>
  <rect class="background" x="0" y="0" width="880" height="450"/>
  <rect class="group" x="458" y="122" width="408" height="236" rx="10"/>
  <text class="small" x="472" y="350">GitHub Action, .github/workflows/pkgdown.yaml</text>
  <path id="tr-docs-build-code" class="wire" d="M210,60 L265,60"/>
  <path id="tr-docs-build-rd" class="wire" d="M435,60 L495,60"/>
  <path id="tr-docs-build-reference" class="wire" d="M570,90 L570,155"/>
  <path id="tr-docs-build-articles" class="wire" d="M210,180 L478,180"/>
  <path id="tr-docs-build-readme" class="wire" d="M210,270 L478,270"/>
  <path id="tr-docs-build-config" class="wire" d="M210,370 C360,370 390,300 478,300"/>
  <path id="tr-docs-build-output" class="wire" d="M662,185 L700,185"/>
  <path id="tr-docs-build-deploy" class="wire" d="M775,215 L775,262"/>
  <path id="tr-docs-build-publish" class="wire" d="M775,322 L775,380"/>
  <circle class="dot alt" r="5"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#tr-docs-build-code"/></animateMotion></circle>
  <circle class="dot alt" r="5"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#tr-docs-build-rd"/></animateMotion></circle>
  <circle class="dot alt" r="5"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#tr-docs-build-reference"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#tr-docs-build-articles"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite"><mpath href="#tr-docs-build-readme"/></animateMotion></circle>
  <circle class="dot" r="5"><animateMotion dur="2.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#tr-docs-build-config"/></animateMotion></circle>
  <circle class="dot ok" r="6"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#tr-docs-build-output"/></animateMotion></circle>
  <circle class="dot ok" r="6"><animateMotion dur="1s" begin="-0.33s" repeatCount="indefinite"><mpath href="#tr-docs-build-deploy"/></animateMotion></circle>
  <circle class="dot ok" r="6"><animateMotion dur="1s" begin="-0.66s" repeatCount="indefinite"><mpath href="#tr-docs-build-publish"/></animateMotion></circle>
  <rect class="box" x="20" y="30" width="190" height="60" rx="8"/>
  <text class="title" x="115" y="56" text-anchor="middle">R/*.R</text>
  <text class="small" x="115" y="75" text-anchor="middle">roxygen2 #' comments</text>
  <rect class="box" x="265" y="30" width="170" height="60" rx="8"/>
  <text class="title" x="350" y="56" text-anchor="middle">roxygen2</text>
  <text class="mono" x="350" y="75" text-anchor="middle">devtools::document()</text>
  <rect class="store" x="495" y="30" width="150" height="60" rx="8"/>
  <text class="title" x="570" y="56" text-anchor="middle">man/*.Rd</text>
  <text class="small" x="570" y="75" text-anchor="middle">help pages, committed</text>
  <text class="small" x="672" y="64">run locally, before a commit</text>
  <rect class="box" x="20" y="150" width="190" height="60" rx="8"/>
  <text class="title" x="115" y="176" text-anchor="middle">vignettes/articles/</text>
  <text class="small" x="115" y="195" text-anchor="middle">*.Rmd guides, diagrams/</text>
  <rect class="box" x="20" y="240" width="190" height="60" rx="8"/>
  <text class="title" x="115" y="266" text-anchor="middle">README.md</text>
  <text class="small" x="115" y="285" text-anchor="middle">the home page</text>
  <rect class="box" x="20" y="340" width="190" height="60" rx="8"/>
  <text class="title" x="115" y="366" text-anchor="middle">_pkgdown.yml</text>
  <text class="small" x="115" y="385" text-anchor="middle">reference, navbar, theme</text>
  <rect class="accent-box" x="478" y="155" width="184" height="170" rx="8"/>
  <text class="title" x="570" y="185" text-anchor="middle">pkgdown</text>
  <text class="small" x="570" y="207" text-anchor="middle">Bootstrap 5, flatly</text>
  <text class="small" x="570" y="227" text-anchor="middle">reference from man/</text>
  <text class="small" x="570" y="247" text-anchor="middle">articles from .Rmd</text>
  <text class="small" x="570" y="267" text-anchor="middle">home from README</text>
  <text class="small" x="570" y="287" text-anchor="middle">Mermaid in the header</text>
  <text class="mono" x="570" y="310" text-anchor="middle">build_site_github_pages()</text>
  <rect class="store" x="700" y="155" width="150" height="60" rx="8"/>
  <text class="title" x="775" y="181" text-anchor="middle">docs/</text>
  <text class="small" x="775" y="200" text-anchor="middle">static HTML site</text>
  <rect class="box" x="700" y="262" width="150" height="60" rx="8"/>
  <text class="title" x="775" y="288" text-anchor="middle">Deploy step</text>
  <text class="small" x="775" y="307" text-anchor="middle">commits docs/ to gh-pages</text>
  <rect class="store" x="700" y="380" width="150" height="56" rx="8"/>
  <text class="title" x="775" y="405" text-anchor="middle">gh-pages</text>
  <text class="small" x="775" y="423" text-anchor="middle">served by GitHub Pages</text>
</svg>
