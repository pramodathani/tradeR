url: https://pramodathani.github.io/tradeR/

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: |
      <script type="module">import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"; mermaid.initialize({ startOnLoad: true, theme: "neutral" });</script>

navbar:
  structure:
    left:
      - intro
      - reference
      - articles
    right:
      - search
      - github

