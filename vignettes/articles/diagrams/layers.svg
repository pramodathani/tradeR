<svg width="900" height="570" viewBox="0 0 900 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tm-layers-title tm-layers-description">
  <title id="tm-layers-title">The layers between your program and the brokers</title>
  <desc id="tm-layers-description">Your program uses instrument, basket, order and account objects, which all send their requests through one shared UnifiedBrokerInterface client. The client calls UBI's REST API on 127.0.0.1:8080. UBI answers reads from its own Redis and TimescaleDB, which it keeps filled from the ten brokers, and hands orders to its order engine, which sends them to a broker. Orange dots are reads travelling up to your program; the blue dot is an order travelling down to a broker.</desc>
  <style>
    .box { fill: #fff7f2; stroke: #5f6368; stroke-width: 1.5; }
    .store { fill: #eef3fb; stroke: #5f6368; stroke-width: 1.5; }
    .accent-box { fill: #fff7f2; stroke: #ff5722; stroke-width: 2.5; }
    .wire { fill: none; stroke: #5f6368; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wire-solid { fill: none; stroke: #5f6368; stroke-width: 1.5; }
    text { fill: #202124; font-family: 'Roboto', sans-serif; font-size: 13px; }
    text.title { font-size: 15px; font-weight: 700; }
    text.small { fill: #6b7280; font-size: 11px; }
    text.mono { font-family: 'Roboto Mono', monospace; font-size: 11px; }
    .dot { fill: #ff5722; }
    .dot.alt { fill: #1565c0; }
    .dot.ok { fill: #1b8a3a; }
    @media (prefers-reduced-motion: no-preference) {
      .wire { animation: march 1.2s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { display: none; }
    }
    @keyframes march { to { stroke-dashoffset: -18; } }
  </style>
  <rect x="0" y="0" width="900" height="570" fill="#ffffff"/>
  <path id="tm-layers-read" class="wire" d="M270,500 L270,70"/>
  <path id="tm-layers-order" class="wire" d="M630,70 L630,500"/>
  <circle class="dot" r="6"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#tm-layers-read"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="4s" begin="-1.33s" repeatCount="indefinite"><mpath href="#tm-layers-read"/></animateMotion></circle>
  <circle class="dot" r="6"><animateMotion dur="4s" begin="-2.67s" repeatCount="indefinite"><mpath href="#tm-layers-read"/></animateMotion></circle>
  <circle class="dot alt" r="6"><animateMotion dur="4s" begin="-0.6s" repeatCount="indefinite"><mpath href="#tm-layers-order"/></animateMotion></circle>
  <rect class="box" x="300" y="20" width="300" height="50" rx="25"/>
  <text class="title" x="450" y="50" text-anchor="middle">Your program</text>
  <rect class="wire-solid" x="60" y="92" width="780" height="172" rx="10" stroke-dasharray="2 4"/>
  <text class="small" x="450" y="108" text-anchor="middle">tradeR, inside your R session</text>
  <rect class="box" x="120" y="115" width="660" height="54" rx="8"/>
  <text class="title" x="450" y="138" text-anchor="middle">Instrument, basket, order and account objects</text>
  <text class="mono" x="450" y="157" text-anchor="middle">Equity, EquityIndexOption, Portfolio, BracketOrder, Account, ...</text>
  <rect class="accent-box" x="120" y="195" width="660" height="54" rx="8"/>
  <text class="title" x="450" y="218" text-anchor="middle">UnifiedBrokerInterface, one client shared by every object</text>
  <text class="mono" x="450" y="237" text-anchor="middle">one access token, reconnect on 401</text>
  <text class="small" x="282" y="282">reads come up</text>
  <text class="small" x="618" y="282" text-anchor="end">orders go down</text>
  <rect class="wire-solid" x="60" y="290" width="780" height="176" rx="10" stroke-dasharray="2 4"/>
  <text class="small" x="450" y="306" text-anchor="middle">Unified Broker Interface, a separate service on 127.0.0.1:8080</text>
  <rect class="box" x="120" y="315" width="660" height="54" rx="8"/>
  <text class="title" x="450" y="338" text-anchor="middle">UBI REST API</text>
  <text class="mono" x="450" y="357" text-anchor="middle">/api/instruments/*   /api/portfolio/*   /api/orders/*</text>
  <rect class="store" x="120" y="395" width="300" height="54" rx="8"/>
  <text class="title" x="270" y="418" text-anchor="middle">Redis and TimescaleDB</text>
  <text class="small" x="270" y="437" text-anchor="middle">quotes, candles, orders, positions</text>
  <rect class="box" x="480" y="395" width="300" height="54" rx="8"/>
  <text class="title" x="630" y="418" text-anchor="middle">Order engine</text>
  <text class="small" x="630" y="437" text-anchor="middle">resolves references, runs synthetic types</text>
  <rect class="box" x="120" y="500" width="660" height="54" rx="8"/>
  <text class="title" x="450" y="523" text-anchor="middle">Ten brokers</text>
  <text class="small" x="450" y="542" text-anchor="middle">Dhan, Flattrade, Fyers, Groww, INDmoney, Kotak, Shoonya, Stoxkart, Wisdom Capital, Zerodha</text>
</svg>
