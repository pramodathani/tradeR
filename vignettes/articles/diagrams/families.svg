<svg class="tm-svg" viewBox="0 0 1080 650" width="1080" height="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="families-title families-description">
  <title id="families-title">How the six asset-class files inherit from the instrument classes</title>
  <desc id="families-description">Six family files under R/ sit at the bottom, each listing its R6 classes. Their cash classes and the funds inherit TradeableInstrument directly, their sixteen futures and option classes inherit the derivative base classes, which inherit TradeableInstrument, and their four index classes inherit NonTradeableInstrument. Both of those inherit Instrument, which also inherits the fourteen analysis classes through a single chain ending in PerformanceMeasures. Dots travel upward along each inheritance line.</desc>
