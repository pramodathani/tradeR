    .tm-svg .accent-box { fill: #fff7f2; stroke: #ff5722; stroke-width: 2.5; }
    .tm-svg .wire { fill: none; stroke: #5f6368; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .tm-svg text { fill: #202124; font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; }
    .tm-svg text.title { font-size: 15px; font-weight: 700; }
    .tm-svg text.small { fill: #6b7280; font-size: 11px; }
    .tm-svg text.mono { font-family: 'Roboto Mono', 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .tm-svg .dot { fill: #ff5722; }
    .tm-svg .dot.alt { fill: #1565c0; }
    .tm-svg .dot.ok { fill: #1b8a3a; }
    .tm-svg .swatch { fill: #ff5722; }
    .tm-svg .swatch.alt { fill: #1565c0; }
    .tm-svg .swatch.ok { fill: #1b8a3a; }
    @media (prefers-reduced-motion: no-preference) {
      .tm-svg .wire { animation: tm-march 1.2s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tm-svg circle.dot { display: none; }
    }
    @keyframes tm-march { to { stroke-dashoffset: -18; } }
  </style>
