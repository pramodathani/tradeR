<svg width="900" height="616" viewBox="0 0 900 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Public methods in each analysis class</title>
  <desc id="chart-description">A bar chart of the number of public methods in each of the fourteen analysis classes, coloured by what calculates them in R: CandlestickPatterns 61, PriceStatistics 39, MomentumIndicators 28, PerformanceMeasures 17, MathTransforms 15, OverlapStudies 12, MathOperators 10, StatisticFunctions 8, CycleIndicators 6, PriceTransforms 4, VolumeIndicators 3, VolatilityIndicators 3, Signals 2 and StrategyBacktests 1, which add up to 209.</desc>
  <style>
    text { fill: #202124; font-family: 'Roboto', sans-serif; font-size: 13px; }
    text.title { font-size: 15px; font-weight: 700; }
    text.small { fill: #6b7280; font-size: 11px; }
    text.mono { font-family: 'Roboto Mono', monospace; font-size: 12px; }
    .axis { stroke: #5f6368; stroke-width: 1; }
  </style>
  <rect x="0" y="0" width="900" height="616" fill="#ffffff"/>
  <text class="title" x="20" y="28">Public methods in each analysis class</text>
  <text class="mono" x="220" y="66" text-anchor="end">CandlestickPatterns</text>
  <rect x="230" y="50" width="580" height="24" rx="3" fill="#ff5722"/>
  <text x="816" y="66">61</text>
  <text class="mono" x="220" y="100" text-anchor="end">PriceStatistics</text>
  <rect x="230" y="84" width="371" height="24" rx="3" fill="#1565c0"/>
  <text x="607" y="100">39</text>
  <text class="mono" x="220" y="134" text-anchor="end">MomentumIndicators</text>
  <rect x="230" y="118" width="266" height="24" rx="3" fill="#ffab91"/>
  <text x="502" y="134">28</text>
  <text class="mono" x="220" y="168" text-anchor="end">PerformanceMeasures</text>
  <rect x="230" y="152" width="162" height="24" rx="3" fill="#1565c0"/>
  <text x="398" y="168">17</text>
  <text class="mono" x="220" y="202" text-anchor="end">MathTransforms</text>
  <rect x="230" y="186" width="143" height="24" rx="3" fill="#1565c0"/>
  <text x="379" y="202">15</text>
  <text class="mono" x="220" y="236" text-anchor="end">OverlapStudies</text>
  <rect x="230" y="220" width="114" height="24" rx="3" fill="#ff5722"/>
  <text x="350" y="236">12</text>
  <text class="mono" x="220" y="270" text-anchor="end">MathOperators</text>
  <rect x="230" y="254" width="95" height="24" rx="3" fill="#1565c0"/>
  <text x="331" y="270">10</text>
  <text class="mono" x="220" y="304" text-anchor="end">StatisticFunctions</text>
  <rect x="230" y="288" width="76" height="24" rx="3" fill="#ffab91"/>
  <text x="312" y="304">8</text>
  <text class="mono" x="220" y="338" text-anchor="end">CycleIndicators</text>
  <rect x="230" y="322" width="57" height="24" rx="3" fill="#ff5722"/>
  <text x="293" y="338">6</text>
  <text class="mono" x="220" y="372" text-anchor="end">PriceTransforms</text>
  <rect x="230" y="356" width="38" height="24" rx="3" fill="#ff5722"/>
  <text x="274" y="372">4</text>
  <text class="mono" x="220" y="406" text-anchor="end">VolumeIndicators</text>
  <rect x="230" y="390" width="29" height="24" rx="3" fill="#ff5722"/>
  <text x="265" y="406">3</text>
  <text class="mono" x="220" y="440" text-anchor="end">VolatilityIndicators</text>
  <rect x="230" y="424" width="29" height="24" rx="3" fill="#ff5722"/>
  <text x="265" y="440">3</text>
  <text class="mono" x="220" y="474" text-anchor="end">Signals</text>
  <rect x="230" y="458" width="19" height="24" rx="3" fill="#1565c0"/>
  <text x="255" y="474">2</text>
  <text class="mono" x="220" y="508" text-anchor="end">StrategyBacktests</text>
  <rect x="230" y="492" width="10" height="24" rx="3" fill="#5f6368"/>
