  <line class="axis" x1="230" y1="46" x2="230" y2="520"/>
  <text class="small" x="230" y="540">Public methods, 209 in all</text>
  <rect x="20" y="559" width="14" height="14" rx="2" fill="#ff5722"/>
  <text x="40" y="570">talib package</text>
  <rect x="147.5" y="559" width="14" height="14" rx="2" fill="#1565c0"/>
  <text x="167.5" y="570">base R</text>
